<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Maplesrugs Internal Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-page);
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 48px;
      width: 100%;
      max-width: 400px;
    }

    .login-logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--ibm-blue-dark);
      margin-bottom: 4px;
    }

    .login-logo span {
      font-weight: 300;
      color: var(--text-secondary);
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--text-primary);
      transition: border-color .15s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--ibm-blue);
      box-shadow: 0 0 0 2px rgba(31,112,193,.15);
    }

    .login-error {
      background: #fff1f1;
      border: 1px solid #da1e28;
      border-radius: var(--radius);
      color: #da1e28;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      background: var(--ibm-blue-dark);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }

    .login-btn:hover {
      background: var(--ibm-blue);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">Maplesrugs <span>Internal Portal</span></div>
      <div class="login-subtitle">Sign in with your portal credentials</div>

      {% if error %}
        <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autofocus
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
