# =============================================================================
# IBM HTTP Server (Apache) — Maplesrugs Internal Portal
# =============================================================================
#
# HOW TO USE THIS FILE
# --------------------
# In the IBM HTTP Server Administration Console (port 2001):
#   1. Open your HTTP server instance.
#   2. Go to  Configuration > Edit Configuration File.
#   3. Paste or include the directives below inside your <VirtualHost> block,
#      or at the global server level if you only have one virtual host.
#   4. Save and restart the HTTP server instance.
#
# Alternatively, if you manage the config file directly, include this file:
#   Include /www/myportal/conf/portal.conf
#
# ASSUMPTIONS
# -----------
#   - Portal Flask app runs on 0.0.0.0:4050  (binds all interfaces)
#   - Pattern Search app runs on your IBM i's IP:5005
#   - Replace 172.16.1.2 below with your IBM i's actual IP address.
#   - IBM HTTP Server runs in the IBM i native environment (not PASE), so
#     127.0.0.1 loopback is unreliable — use the real IP instead.
#   - Add a new ProxyPass pair for every new app you register.
#
# =============================================================================

# --- Required modules --------------------------------------------------------
# These must be loaded in your httpd.conf.  They are usually already present
# in the default IBM HTTP Server config; confirm by checking LoadModule lines.
#
# LoadModule proxy_module         /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM
# LoadModule proxy_http_module    /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM
# LoadModule rewrite_module       /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM
# LoadModule headers_module       /QSYS.LIB/QHTTPSVR.LIB/QZSRCORE.SRVPGM


# =============================================================================
# Virtual Host block — adjust ServerName and port as needed
# =============================================================================
<VirtualHost *:80>

    ServerName portal.maplesrugs.internal
    # ServerAlias internalportal myibmi.maplesrugs.com

    # -------------------------------------------------------------------------
    # Authentication — IBM i User Profiles
    # -------------------------------------------------------------------------
    # IBM HTTP Server on IBM i supports authenticating against OS user profiles
    # using the built-in AuthType.  Every request must be authenticated before
    # the proxy forwards it.
    #
    # NOTE: For HTTPS (recommended for production), change <VirtualHost *:80>
    # to <VirtualHost *:443> and add SSL directives.

    AuthType Basic
    AuthName "Maplesrugs Internal Portal"

    # IBM i native authentication — authenticates against system user profiles.
    # This directive is specific to IBM HTTP Server on IBM i.
    AuthIBMiUserRegistry On

    Require valid-user

    # Pass the authenticated IBM i user profile name to the Flask app.
    # Flask reads this as the X-Remote-User header in auth/middleware.py.
    RequestHeader set X-Remote-User %{REMOTE_USER}s

    # Prevent external clients from spoofing this header.
    # (Unset it from the incoming request before we set it ourselves.)
    RequestHeader unset X-Remote-User early


    # -------------------------------------------------------------------------
    # Proxy settings
    # -------------------------------------------------------------------------
    ProxyRequests Off
    ProxyPreserveHost On

    # Do not allow arbitrary URLs through the proxy.
    # Only the explicitly listed ProxyPass targets are reachable.


    # -------------------------------------------------------------------------
    # Individual application routes
    # IMPORTANT: specific /apps/* rules must come BEFORE the catch-all portal rule.
    # Add one ProxyPass + ProxyPassReverse pair per registered application.
    # -------------------------------------------------------------------------

    # Pattern Search  (application_id: pattern-search)
    # Replace 172.16.1.2 with your IBM i's actual IP address.
    ProxyPass        /apps/pattern-search/  http://172.16.1.2:5005/
    ProxyPassReverse /apps/pattern-search/  http://172.16.1.2:5005/

    # --- Template for future apps ---
    # Uncomment and duplicate for each new application.
    # The path segment must match the application_id in applications.yaml.
    #
    # ProxyPass        /apps/my-new-app/  http://172.16.1.2:5010/
    # ProxyPassReverse /apps/my-new-app/  http://172.16.1.2:5010/


    # -------------------------------------------------------------------------
    # Portal (catch-all) — must be LAST
    # -------------------------------------------------------------------------
    ProxyPass        /  http://172.16.1.2:4050/
    ProxyPassReverse /  http://172.16.1.2:4050/


    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    ErrorLog  /www/myportal/logs/error_log
    CustomLog /www/myportal/logs/access_log combined

</VirtualHost>


# =============================================================================
# HTTPS (recommended for production)
# =============================================================================
# To enable SSL, change <VirtualHost *:80> to <VirtualHost *:443> above and
# add the following inside the VirtualHost block:
#
#   SSLEnable
#   SSLClientAuth None
#   Keyfile /www/myportal/ssl/portal.kdb
#
# Create the key database using Digital Certificate Manager (DCM) on IBM i.
# =============================================================================
# -------------------------------------------------------
# Reverse proxy — Maplesrugs Internal Portal
# -------------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On

# Authentication against IBM i user profiles
AuthType Basic
AuthName "Maplesrugs Internal Portal"
AuthIBMiUserRegistry On
Require valid-user

# Pass the IBM i profile name to Flask
RequestHeader unset X-Remote-User early
RequestHeader set X-Remote-User %{REMOTE_USER}s

# App routes — specific paths BEFORE the catch-all
ProxyPass        /apps/pattern-search/  http://172.16.1.2:5005/
ProxyPassReverse /apps/pattern-search/  http://172.16.1.2:5005/

# Portal catch-all — must be last
ProxyPass        /  http://172.16.1.2:4050/
ProxyPassReverse /  http://172.16.1.2:4050/